<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Guard Question Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="assets/libertys-path-logo-2d.png" type="image/png" />
  <link rel="stylesheet" href="css/dashboard_view.css" />
  <!-- Page-specific styles + scroll fix -->
  <link rel="stylesheet" href="css/questions_manage.css" />
</head>

<body>
  <!-- Top: title left + back-to-dashboard right -->
  <div class="page-top">
    <h1>Guard Question Bank</h1>
    <a class="btn btn-brand btn-back" href="index.php?r=dashboard" aria-label="Back to dashboard">
      <svg class="back-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M15.5 19.5L8 12l7.5-7.5" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>MONITORING BOARD</span>
    </a>
  </div>
  <!--<p class="muted">Route: <code>index.php?r=questions/manage</code></p>-->

  <!--Create / Update Form -->
  <div class="card">
    <h2 id="formTitle">Add New Question</h2>
    <form id="qForm" class="q-form">
      <input type="hidden" id="qId">

      <label for="question_text">Question</label>
      <textarea id="question_text" rows="3" placeholder="Type the question here…" required></textarea>

      <div class="grid-2">
        <div>
          <label for="choice1">Choice A</label>
          <input id="choice1" type="text" placeholder="Choice A" required>
        </div>
        <div>
          <label for="choice2">Choice B</label>
          <input id="choice2" type="text" placeholder="Choice B" required>
        </div>
        <div>
          <label for="choice3">Choice C</label>
          <input id="choice3" type="text" placeholder="Choice C" required>
        </div>
        <div>
          <label for="choice4">Choice D</label>
          <input id="choice4" type="text" placeholder="Choice D" required>
        </div>
      </div>

      <label for="correct_index">Correct Answer</label>
      <select id="correct_index" required>
        <option value="" disabled selected>Select the correct choice…</option>
        <option value="0">A</option>
        <option value="1">B</option>
        <option value="2">C</option>
        <option value="3">D</option>
      </select>

      <div class="form-actions">
        <button id="submitBtn" type="submit">Create</button>
        <button id="cancelEditBtn" type="button" class="hidden">Cancel</button>
        <span id="formMsg" class="form-msg"></span>
      </div>
    </form>

    <!-- Table -->
    <div class="card">
      <h2>Existing Questions</h2>
      <table class="q-table">
        <thead>
          <tr>
            <th>Question</th>
            <th>Choices</th>
            <th>Correct</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="qTbody">
          <tr>
            <td colspan="4">Loading…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/questions_manage.js"></script>
</body>
</html>
