<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Guard Question Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="assets/libertys-path-logo-2d.png" type="image/png" />
  <link rel="stylesheet" href="css/dashboard_view.css" />
  <!-- Page-specific styles + scroll fix -->
  <link rel="stylesheet" href="css/questions_manage.css" />
</head>

<body>
  <h1>Guard Question Bank</h1>
  <!--<p class="muted">Route: <code>index.php?r=questions/manage</code></p>-->

  <!--Create / Update Form -->
  <div class="card">
    <h2 id="formTitle">Add New Question</h2>
    <form id="qForm" autocomplete="off">
      <input type="hidden" id="qId" />
      <label for="question_text">Question</label>
      <textarea id="question_text" required></textarea>

      <div class="grid2">
        <div>
          <label for="choice1">Choice 0</label>
          <input type="text" id="choice1" required />
        </div>
        <div>
          <label for="choice2">Choice 1</label>
          <input type="text" id="choice2" required />
        </div>
        <div>
          <label for="choice3">Choice 2</label>
          <input type="text" id="choice3" required />
        </div>
        <div>
          <label for="choice4">Choice 3</label>
          <input type="text" id="choice4" required />
        </div>
      </div>

      <label for="correct_index">Correct Index (0–3)</label>
      <input type="number" id="correct_index" min="0" max="3" required />

      <div style="margin-top:10px">
        <button type="submit" class="btn-primary" id="submitBtn">Create</button>
        <button type="button" class="btn-ghost hidden" id="cancelEditBtn">Cancel Edit</button>
      </div>
      <div id="formMsg" class="muted" style="margin-top:6px"></div>
    </form>

    <!-- Table -->
    <div class="card">
      <h2>Existing Questions</h2>
      <table>
        <thead>
          <tr>
            <th style="width:60px;">ID</th>
            <th>Question</th>
            <th>Choices</th>
            <th style="width:110px;">Correct</th>
            <th style="width:160px;">Actions</th>
          </tr>
        </thead>
        <tbody id="qTbody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/questions_manage.js"></script>
</body>
</html>
