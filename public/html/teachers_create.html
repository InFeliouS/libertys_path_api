<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add Teacher | Liberty’s Path</title>
  <link rel="icon" href="assets/libertys-path-logo-2d.png" type="image/png" />
  <link rel="stylesheet" href="css/dashboard_view.css" />
  <link rel="stylesheet" href="css/teacher_create.css" />
</head>
<body>
  <header>
    <div class="header-titles">
      <h1>ADD TEACHER ACCOUNT</h1>
      <p class="page-subtitle">Admin tool</p>
    </div>
    <div class="header-left-logos">
      <img src="assets/SDPS-LOGO-transparent.png" alt="SDPS Logo" class="header-logo" />
      <img src="assets/libertys-path-logo-2d-transparent.png" alt="Liberty's Path Logo" class="header-logo" />
    </div>
  </header>

  <main class="tc-container">
    <form class="tc-form" method="post" action="index.php?r=teachers/store" autocomplete="off" novalidate>
      <h2 class="tc-title">Create Teacher</h2>

      <div class="tc-row">
        <label for="username" class="tc-label">Username <span class="tc-req">*</span></label>
        <input id="username" name="username" type="text" class="tc-input" required />
        <div class="tc-hint">Must be unique.</div>
      </div>

      <div class="tc-grid">
        <div class="tc-row">
          <label for="password" class="tc-label">Password <span class="tc-req">*</span></label>
          <input id="password" name="password" type="password" class="tc-input" required />
        </div>
        <div class="tc-row">
          <label for="confirm" class="tc-label">Confirm Password <span class="tc-req">*</span></label>
          <input id="confirm" name="confirm" type="password" class="tc-input" required />
        </div>
      </div>

      <div class="tc-grid">
        <div class="tc-row">
          <label for="first_name" class="tc-label">First name (optional)</label>
          <input id="first_name" name="first_name" type="text" class="tc-input" placeholder="e.g., Juan" />
        </div>
        <div class="tc-row">
          <label for="last_name" class="tc-label">Last name (optional)</label>
          <input id="last_name" name="last_name" type="text" class="tc-input" placeholder="e.g., Dela Cruz" />
        </div>
      </div>

      <div class="tc-row">
        <label class="tc-label">Assign Sections (optional)</label>
        <div id="tcSections" class="tc-sections">
          <div class="tc-hint">Loading sections…</div>
        </div>
      </div>

      <div class="tc-actions">
        <button class="tc-btn tc-btn-primary" type="submit">Create Teacher</button>
        <a class="tc-btn tc-btn-ghost" href="index.php?r=dashboard">Cancel</a>
      </div>
    </form>
  </main>

  <script src="js/teacher_create.js"></script>
</body>
</html>
