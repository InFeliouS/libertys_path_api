<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Section</title>

  <!-- Global page look (paper/stone background, paddings, buttons) -->
  <link rel="stylesheet" href="css/dashboard_view.css">
  <!-- Roster table styling you like -->
  <link rel="stylesheet" href="css/section_detail.css">
  <!-- Existing leaderboard visuals -->
  <link rel="stylesheet" href="css/leaderboard.css">
  <!-- Small glue for spacing & minor tweaks just for this page -->
  <link rel="stylesheet" href="css/section_leaderboard.css">
</head>
<body>
  <div class="page">
    <div class="page-header">
      <a class="btn btn-back" href="index.php?r=dashboard">&larr; Back to Monitoring Board</a>
      <h1 id="sectionTitle">Section</h1>
    </div>

    <!-- Card #1: Slim Student Roster -->
    <div class="card">
      <div class="search-bar">
        <input id="searchLastName" type="text" placeholder="Search by last name..." />
        <button id="btnDeleteSelected" class="btn btn-danger">DELETE SELECTED</button>
        <a id="btnDownloadCsv" class="btn" href="#">Download Student CSV</a>
      </div>

      <div class="table-container">
        <table id="studentsTable">
          <thead>
            <tr>
              <th style="width:40px;"><input type="checkbox" id="checkAll"></th>
              <th>LAST NAME</th>
              <th>FIRST NAME</th>
              <th>MIDDLE NAME</th>
              <th>USERNAME</th>
            </tr>
          </thead>
          <tbody id="studentsTbody">
            <tr><td colspan="5" class="muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="footnote" id="lastUpdated"></div>
    </div>

    <!-- Card #2: Per-Section Leaderboard -->
    <div class="card" id="leaderboardCard">
      <h2 style="margin:0;">Leaderboard</h2>
      <div class="lb-muted" id="lbSubtitle">Top results for this section</div>

      <div class="lb-toolbar">
        <label for="lbLimit">Limit</label>
        <select id="lbLimit" class="lb-select">
          <option value="10">Top 10</option>
          <option value="25">Top 25</option>
          <option value="50" selected>Top 50</option>
          <option value="100">Top 100</option>
        </select>

        <label class="lb-check-wrap">
          <input type="checkbox" id="lbPerfectOnly" class="lb-checkbox"> Perfect only
        </label>

        <label class="lb-check-wrap">
          <input type="checkbox" id="lbAutoRefresh" class="lb-checkbox"> Auto refresh (30s)
        </label>

        <div class="spacer"></div>
        <button class="btn" id="lbRefreshBtn">Refresh</button>
      </div>

      <div class="lb-tablewrap">
        <table id="lbTable">
          <thead>
            <tr>
              <th style="width:64px;">#</th>
              <th>Players</th>
              <th>Score</th>
              <th>Time Left</th>
              <th>Correct</th>
              <th>Notes</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="lbBody">
            <tr><td colspan="7" class="lb-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="lb-meta">
        <div id="lbUpdated" class="lb-muted"></div>
        <div id="lbRows" class="lb-muted"></div>
      </div>
    </div>
  </div>

  <script src="js/section_detail.js" defer></script>
</body>
</html>
