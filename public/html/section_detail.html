<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Section</title>
  <link rel="stylesheet" href="css/dashboard_view.css" />
  <link rel="stylesheet" href="css/section_detail.css" />
  <link rel="stylesheet" href="css/leaderboard.css" />
</head>
<body>
  <div class="page">
    <div class="page-header">
       <h1 id="sectionTitle">View Section</h1>
      <a class="btn btn-back" href="index.php?r=dashboard">&larr; BACK</a>
    </div>

    <div class="card">
      <div class="search-bar">
        <input id="searchLastName" type="text" placeholder="Search by last name..." />
        <button id="btnDeleteSelected" class="btn btn-danger">DELETE SELECTED</button>
        <a id="btnDownloadCsv" class="btn-csv" href="#">Download Student CSV</a>

        <div class="spacer"></div>
        <label class="lb-muted" for="studentsPageSize">Rows per page</label>
        <select id="studentsPageSize" class="lb-select">
          <option value="10" selected>10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>

      <div class="table-container">
        <table id="studentsTable">
          <thead>
            <tr>
              <th style="width:40px;"><input type="checkbox" id="checkAll" /></th>
              <th>LAST NAME</th>
              <th>FIRST NAME</th>
              <th>MIDDLE NAME</th>
              <th>USERNAME</th>
            </tr>
          </thead>
          <tbody id="studentsTbody">
            <tr><td colspan="5" class="muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Students pagination -->
      <div class="pager" id="studentsPager">
        <button class="btn" id="studPrevBtn">&larr; Prev</button>
        <span id="studPageInfo" class="lb-muted">Page 1 of 1</span>
        <button class="btn" id="studNextBtn">Next &rarr;</button>
      </div>

      <div class="footnote" id="lastUpdated"></div>
    </div>

    <!-- ===== Card: Leaderboard ===== -->
    <div class="card" id="leaderboardCard">
      <h2 style="margin:0;">Leaderboard</h2>
      <div class="lb-muted" id="lbSubtitle">Top results for this section</div>

      <div class="lb-toolbar">
        <label class="lb-muted" for="lbPageSize">Rows per page</label>
        <select id="lbPageSize" class="lb-select">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>

        <label class="lb-check-wrap">
          <input type="checkbox" id="lbPerfectOnly" class="lb-checkbox" />
          Perfect only
        </label>

        <label class="lb-check-wrap">
          <input type="checkbox" id="lbAutoRefresh" class="lb-checkbox" />
          Auto refresh (30s)
        </label>

        <div class="spacer"></div>
        <button class="btn" id="lbRefreshBtn">Refresh</button>
      </div>

      <div class="lb-tablewrap">
        <table id="lbTable">
          <thead>
            <tr>
              <th style="width:64px;">#</th>
              <th>Players</th>
              <th>Score</th>
              <th>Time Left</th>
              <th>Run</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="lbBody">
            <tr><td colspan="6" class="lb-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Leaderboard pagination -->
      <div class="pager" id="lbPager">
        <button class="btn" id="lbPrevBtn">&larr; Prev</button>
        <span id="lbPageInfo" class="lb-muted">Page 1 of 1</span>
        <button class="btn" id="lbNextBtn">Next &rarr;</button>
      </div>

      <div class="lb-meta">
        <div id="lbUpdated" class="lb-muted"></div>
        <div id="lbRows" class="lb-muted"></div>
      </div>
    </div>
  </div>

  <script src="js/section_detail.js" defer></script>
</body>
</html>
