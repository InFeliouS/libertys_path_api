<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Leaderboard • Liberty’s Path</title>

  <!-- FIXED PATHS: relative to /public/ -->
  <link rel="stylesheet" href="css/leaderboard.css?v=1">
</head>
<body class="lb-body">
  <header class="lb-header">
    <div class="lb-header__inner">
      <h1 class="lb-title">Leaderboard</h1>
      <nav class="lb-nav">
        <a class="lb-btn lb-btn--ghost" href="index.php?r=dashboard">Dashboard</a>
        <a class="lb-btn lb-btn--ghost" href="index.php?r=questions/manage">Question Bank</a>
      </nav>
    </div>
  </header>

  <main class="lb-main">
    <section class="lb-panel">
      <form id="lbFilters" class="lb-filters" autocomplete="off">
        <div class="lb-field">
          <label for="section" class="lb-label">Section</label>
          <input id="section" name="section" class="lb-input" type="text" placeholder="e.g. 4A or leave blank for All" />
        </div>

        <div class="lb-field">
          <label for="limit" class="lb-label">Limit</label>
          <select id="limit" name="limit" class="lb-select">
            <option value="10">Top 10</option>
            <option value="20">Top 20</option>
            <option value="50" selected>Top 50</option>
            <option value="100">Top 100</option>
          </select>
        </div>

        <div class="lb-field lb-field--checkbox">
          <input id="perfectOnly" name="perfectOnly" type="checkbox" />
          <label for="perfectOnly">Perfect only</label>
        </div>

        <div class="lb-actions">
          <button type="button" id="refresh" class="lb-btn">Refresh</button>
          <button type="button" id="exportCsv" class="lb-btn lb-btn--secondary">Export CSV</button>
          <button type="button" id="shareLink" class="lb-btn lb-btn--ghost">Copy Share Link</button>
          <label class="lb-auto">
            <input id="autoRefresh" type="checkbox" />
            Auto refresh (30s)
          </label>
        </div>
      </form>
    </section>

    <section class="lb-panel">
      <div class="lb-tablewrap">
        <table class="lb-table" id="lbTable" aria-describedby="lbMeta">
          <thead>
            <tr>
              <th style="width:64px;">#</th>
              <th>Players</th>
              <th>Score</th>
              <th>Time&nbsp;Left</th>
              <th>Correct</th>
              <th>Notes</th>
              <th>Section</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td class="lb-center lb-muted lb-pad" colspan="8">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div id="lbMeta" class="lb-meta">
        <span id="lastUpdated" class="lb-muted">Last updated: —</span>
        <span id="rowCount" class="lb-muted">Rows: 0</span>
      </div>
    </section>
  </main>

  <!-- FIXED PATH -->
  <script src="js/leaderboard.js?v=1" defer></script>
</body>
</html>
