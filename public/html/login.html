<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liberty's Path | Login</title>
  <!-- <base href="..."> is injected by routes.php -->
  <link rel="icon" href="assets/libertys-path-logo-2d.png" type="image/png" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <img src="assets/libertys-path-abstract-two.png" alt="Decorative background pattern" />
    </div>

    <div class="right-panel">
      <form id="loginForm" class="login-form" action="index.php?route=login/process" method="POST" autocomplete="off">
        <div class="logo-wrapper">
          <img src="assets/SDPS-LOGO-transparent.png" alt="SDPS Logo" class="school-logo" />
        </div>

        <label for="username">USERNAME</label>
        <input type="text" id="username" name="username" placeholder="Enter username here" required />

        <label for="password">PASSWORD</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter password here" required />
          <span id="togglePassword">Show</span>
        </div>

        <button type="submit">LOG IN</button>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
