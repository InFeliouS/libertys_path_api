<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liberty's Path | Login</title>
  <link rel="icon" href="assets/libertys-path-logo-2d.png" type="image/png" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <img src="assets/libertys-path-abstract-two.png" alt="Decorative background pattern" />
    </div>
    <div class="right-panel">
      <form class="login-form" action="index.php?r=login/process" method="POST">
        <label for="username">USERNAME</label>
        <input type="text" id="username" name="username" placeholder="Enter username here" required />

        <label for="password">PASSWORD</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter password here" required />
          <span id="togglePassword">Show</span>
        </div>
              <!-- ADDED: in-page alert (stays on this page) -->
      <div id="loginAlert" class="alert" aria-live="polite"></div>

        <button type="submit">LOG IN</button>
      </form>
    </div>
  </div>

  <script src="js/login.js?v=20250908"></script>
</body>
</html>
