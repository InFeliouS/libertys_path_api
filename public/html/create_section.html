<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

</head>
<body>
<main id="main-container">
  <section id="form-container">
    <h2 id="form-title">CREATE NEW SECTION</h2>
    <form id="create-section-form" action="index.php?r=sections/create" method="POST">
      
      <label for="section_name">SECTION NAME</label>
      <input type="text" id="section_name" name="section_name" placeholder="ST. DIEGO" required/>

      <label for="start_school_year">START OF SCHOOL YEAR</label>
      <select id="start_school_year" name="start_school_year" required>
        <option value="">— Select Year —</option>
      </select>

      <label for="end_school_year">END OF SCHOOL YEAR</label>
      <select id="end_school_year" name="end_school_year" required>
        <option value="">— Select Year —</option>
      </select>

      <button type="submit">CREATE SECTION</button>
    </form>
  </section>
</main>

  <!-- Back to monitoring board link -->
  <div>
    <a id="dashboard-link" href="index.php?r=dashboard">← Back to Teacher Admin Monitoring Board</a>
  </div>
