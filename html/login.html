<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher Login</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <img src="../assets/images/placeholder-muna.png" alt="Login Design"/>
    </div>
    <div class="right-panel">
      <form class="login-form" action="../php/auth/login_process.php" method="POST">
        <label for="username">USERNAME</label>
        <input type="text" id="username" name="username" placeholder="Enter username here" required/>

        <label for="password">PASSWORD</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter password here" required/>
          <span id="togglePassword">Show</span>
        </div>              

        <button type="submit">LOG IN</button>
      </form>
    </div>
  </div>

  <script src="../js/script.js"></script>
</body>
</html>
